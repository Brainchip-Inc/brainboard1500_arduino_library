# Which languages the lint gate checks in this repository.
#
# Remove any language this repo already lints in its own CI. The gates never
# replace or duplicate a lint job that is already working here.
#
# Recognised values: python javascript typescript c cpp bash html css
#
# Nothing is removed: this repository had no CI at all before the gates, so no
# language is covered elsewhere. The languages with no files today stay listed
# so that the first file of that kind is linted the day it arrives.
LINT_LANGUAGES="python javascript typescript c cpp bash html css"

# Paths the lint gate never looks at, as one extended regular expression matched
# against repository-relative paths.
#
# This library vendors large third-party trees and ships generated model assets,
# and between them they are most of the repository by file count. Linting them
# would make every pull request that touches one a wall of findings nobody can
# act on: a vendored file has to stay identical to the version it came from, and
# a generated file loses any hand fix on the next export. A gate that reports
# work nobody can do gets switched off, so this one is pointed only at the code
# this repository actually owns and is free to reformat, which is src/BB15.{h,cpp},
# src/bb15/, src/internal/ other than legacy_akd1500/, the example sketches and
# tools/.
#
# What is excluded and why:
#   src/flatbuffers/               vendored FlatBuffers headers
#   src/akida_engine/              Akida engine
#   src/akida/                     Akida engine
#   src/engine/                    Akida engine
#   src/akida_port/                Akida engine
#   src/akd500/                    Akida engine, the akida::soc::akd500 headers
#   src/infra/                     Akida engine, included by src/akida_engine/
#   src/internal/legacy_akd1500/   superseded AKD1500 sources, kept for reference
#   examples/*/program.{h,cpp}     exported model data, see "Getting Started" in
#   examples/*/model_metadata.*    README.md; program.cpp is a 14000 line array
#   examples/*/kiss_fft*.{c,h}     kissfft, vendored unmodified
#
# This is a blocklist rather than an allowlist on purpose. A newly vendored tree
# that nobody remembers to add here fails loudly on the pull request that lands
# it, and the person landing it knows exactly which line to add. An allowlist
# would instead drop newly written BrainChip code out of the gate in silence,
# and nobody would ever find out.
LINT_EXCLUDE_REGEX="^src/(akida|akida_engine|akida_port|akd500|engine|flatbuffers|infra)/|^src/internal/legacy_akd1500/|^examples/[^/]+/(program|model_metadata|kiss_fft|kiss_fftr)\.(c|h|cpp)$"
